<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba nimpa css</title>
<style>
    h1 {
        color: aqua;
    }

    .hijau {
        color: darkgreen;
    }

    .dua {
        color: brown;
    }

    ul {
        color: blue;
    }

    ul li a {
        color: rgb(217, 19, 128);
        text-decoration: none;

    }

     ul li a:hover{
        text-decoration: underline;
     }

    img {
        width: 350px;
        filter: grayscale() blur(5px);
        transition: 1s;
    }

    img:hover {
        filter: grayscale(0) blur(0) ;
    }
</style>

</head>
<body>
    <h1 class="hijau">Hello World</h1>

    <ul>
        <li>satu</li>
        <li class="dua">dua</li>
        <li>tiga</li>
    </ul>

    <ul>
        <li><a href="">link 1</a></li>
        <li><a href="">link 2</a></li>
        <li><a href="">link 3</a></li>
        <li><a href="">link 4</a></li>
        <li><a href="">link 5</a></li>
    </ul>

    <img src="/kuliah/Pertemuan 9/foto.png" alt="">
</body>
</html>
