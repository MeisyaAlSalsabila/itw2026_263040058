<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemen form</title>
</head>
<body>
    
<h1>Contoh Elemen-Elemen form pada HTML</h1>

<form>
    <label for="nama">Nama:
    <input type="text" id="nama" name="nama" 
    placeholder="Masukkan Nama"><br>
    </label>

    <label for="password">Password:
     <input type="password" id="password" name="password" 
    placeholder="Masukkan Password"><br>
    </label>

    <label for="email">Email:
     <input type="email" id="email" name="email" 
    placeholder="Masukkan Email"><br>
    </label>
    
    <label for="angka">Angka!:
     <input type="number" id="number" name="number" 
     min="0" max="100" step="5"> <br>
    </label>

    <label for="tanggal">Tanggal:
     <input type="date" id="tanggal" name="tanggal"> <br>
    </label>

    <label for="warna">Warna:
     <input type="color" id="warna" name="warna"> <br>
    </label>

    <br>
    <button type="submit">Kirim!</button>
</form>

</body>
</html>
