<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemen form</title>
</head>
<body>
    
<h1>Contoh Elemen-Elemen form di dalam tabel</h1>

<form>
    <table cellpadding="4">

       <tr>
        <td align="right">
            <label for="nama">Nama:</label>
        </td>
        <td>
            <input type="text" id="nama" name="nama" 
             placeholder="Masukkan Nama"><br>
        </td>
       </tr>

       <tr>
        <td align="right">
            <label for="password">Password:</label>
        </td>
        <td>
             <input type="password" id="password" name="password" 
    placeholder="Masukkan Password"><br>
        </td>
       </tr>

       <tr>
        <td align="right">
            <label for="email">Email:</label>
        </td>
        <td> <input type="email" id="email" name="email" 
    placeholder="Masukkan Email"><br></td>
       </tr>

       <tr>
        <td align="right">
            <label for="angka">Angka:</label>
        </td>
        <td>
            <input type="number" id="number" name="number" 
     min="0" max="100" step="5"> <br>
        </td>
       </tr>

       <tr>
        <td align="right">
            <label for="tanggal">Tanggal:</label>
        </td>
        <td>
            <input type="date" id="tanggal" name="tanggal"> <br>
        </td>
       </tr>

       <tr>
        <td align="right">
            <label for="warna">Warna:</label>
        </td>
        <td>
            <input type="color" id="warna" name="warna"> <br>
        </td>
       </tr>
       
       <tr>
        <td colspan="2">
            <button type="submit">Kirim!</button>
        </td>
       </tr>
    </table>

</form>

</body>
</html>
