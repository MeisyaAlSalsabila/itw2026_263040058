<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba margin table</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="5">
            <tr>
                <th rowspan="3">Baris ini</th>
                <th colspan="2">kolom 1 & 2</th>
                <th>Kolom 3</th>
            </tr>
        <tr>
            
            <td>Baris 1, kolom 1</td>
            <td>Baris 1, kolom 2</td>
            <td>Baris 1, kolom 3</td>
        </tr>
        <tr>
           
            <td colspan="2"> kolom 1 dan 2 di gabung</td>
            <td>Baris 2, kolom 3</td>
        </tr>
    </table>
</body>
</html>
