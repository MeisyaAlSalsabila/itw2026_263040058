<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba background</title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right, rgb(226, 132, 196) 40%, rgb(130, 233, 130));
            height: 100vh;
        }
        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: lightcoral;
            background-image: linear-gradient(to bottom, rgb(87, 7, 62) 40%, rgb(254, 116, 208));
        }
        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: lightcoral;
            background-image: radial-gradient(rgb(87, 7, 62) 40%, rgb(36, 1, 24));
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: lightcoral;
            background-image: conic-gradient(rgb(87, 7, 62), rgb(45, 3, 97), rgb(3, 88, 5));
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
