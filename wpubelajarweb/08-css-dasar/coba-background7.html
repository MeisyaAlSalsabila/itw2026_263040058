<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #681818;            
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid #fff;
            margin: auto;
            background-image: url('img/sepatu.png'), url('img/blop.png'), url('img/lautbiru.png');

            background-size: 400px, 400px, 400px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center top, bottom left;
            background-color: #f0f0f0;
            border-radius: 50%;

        }

        h1 {
            color: #fff;
            text-align: center;
            font-family: 'BebasNeue-Reguler', Helvetica, sans-serif;
            font-size: 50px;
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>
    <h1>My shoes profile</h1>
    <div class="frame"></div>

</body>
</html>
