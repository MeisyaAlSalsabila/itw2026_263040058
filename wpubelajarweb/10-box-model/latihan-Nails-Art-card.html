<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nails Art Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #EBD8C8;
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px;
    }

    .product-card {
      background-color: #fff;
      width: 330px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 10px 20px rgb(0 0 0 / 0.1);
    }

    .product-image {
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-category {
      font-size: 12px;
      color: #4A0715;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 22px;
      font-weight: bold;
      color: #720F20;
      margin-bottom: 12px;
    }

    .product-description {
      font-size: 14px;
      color: #4A0715;
      line-height: 1.6;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .price-section {
      margin-bottom: 20px;
    }

    .price-section .price {
      font-size: 26px;
      color: #000;
      font-weight: bold;
    }

    .price-section .original-price {
      font-size: 15px;
      color: #999;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .size-options-wrapper {
      border: none;
    }

    .size-label-text {
      font-size: 13px;
      color: #333;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .size-options {
      margin-bottom: 25px;
    }

    .size-options input[type="radio"] {
      display: none;
    }

    .size-options label {
      display: inline-block;
      width: 44px;
      height: 44px;
      border: 2px solid #eee;
      text-align: center;
      line-height: 40px;
      margin-right: 8px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    .size-options input[type="radio"]:checked+label {
      background-color: #4A0715;
      border-color: #F8F3EE;
      color: #F8F3EE;
    }

    .buy-button {
      width: 100%;
      padding: 16px;
      background-color: #4A0715;
      color: white;
      border: none;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .buy-button:hover {
      background-color: #720F20;
    }
  </style>
</head>

<body>
  <article class="product-card">
    <figure class="product-image">
      <img src="img/Nails-Art.png"
        alt="Nails Art">
    </figure>

    <p class="product-category">Nails Art</p>
    <h3 class="product-title">Burgundy Elegance</h3>

    <p class="product-description">Burgundy Elegance adalah koleksi press-on nails dengan perpaduan warna merah maroon, nude, dan hitam yang dihiasi motif leopard, bunga, serta aksen gold. Memberikan tampilan kuku yang elegan, mewah, dan unik.</p>

    <div class="price-section">
      <span class="price">IDR 125,000</span>
      <del class="original-price">IDR 175,000</del>
    </div>

    <form action="">
      <fieldset class="size-options-wrapper">
        <legend class="size-label-text">Pilih Ukuran:</legend>

        <div class="size-options">
          <input type="radio" name="size" id="XS" value="XS">
          <label for="XS">XS</label>

          <input type="radio" name="size" id="S" value="S">
          <label for="S">S</label>

          <input type="radio" name="size" id="M" value="M">
          <label for="M">M</label>

          <input type="radio" name="size" id="L" value="L">
          <label for="L">L</label>

        </div>
      </fieldset>

      <button class="buy-button" type="submit">Tambahkan ke Keranjang</button>
    </form>
  </article>
</body>

</html>
